name: Cross Platform Build

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    name: Build on ${{ matrix.job }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { job: ubuntu-x64,    runner: ubuntu-latest,    rids: "linux-x64 linux-musl-x64 linux-arm", wheel_archs: "x86_64" }
          - { job: ubuntu-arm64,  runner: ubuntu-24.04-arm, rids: "linux-arm64 linux-musl-arm64",       wheel_archs: "aarch64" }
          - { job: windows-x64,   runner: windows-latest,   rids: "win-x64",                            wheel_archs: "AMD64" }
          - { job: windows-arm64, runner: windows-11-arm,   rids: "win-arm64",                          wheel_archs: "ARM64" }
          # Apple Silicon cross-builds the x86_64 assets and tests them under
          # Rosetta; GitHub is retiring its Intel macOS images.
          - { job: macos-arm64,   runner: macos-14,         rids: "osx-arm64 osx-x64",                  wheel_archs: "arm64 x86_64 universal2" }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # cibuildwheel uses the runner's Python to drive builds on macOS and
      # Windows; Linux builds happen inside the manylinux/musllinux images.
      - uses: actions/setup-python@v7
        if: runner.os != 'Linux'
        with:
          python-version: "3.12"
      # linux-arm's .NET tests run in an armv7 container under emulation.
      - uses: docker/setup-qemu-action@v4
        if: matrix.job == 'ubuntu-x64'
        with:
          platforms: arm
      # osx-x64 unit tests and ABI probe run during the native build.
      - name: Install Rosetta
        if: runner.os == 'macOS'
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Build native libraries
        shell: bash
        run: scripts/build-natives.sh ${{ matrix.rids }}
      - name: Check the Windows DLLs need no VC++ redistributable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.* -property installationPath
          $hostDir = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'Hostarm64' } else { 'Hostx64' }
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -match "\\$hostDir\\" } | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found" }
          foreach ($rid in "${{ matrix.rids }}".Split(' ', [StringSplitOptions]::RemoveEmptyEntries)) {
            $dll = "native-$rid\lib\osdp.dll"
            $machine = if ($rid -eq 'win-arm64') { 'AA64 machine \(ARM64\)' } else { '8664 machine \(x64\)' }
            $headers = & $dumpbin.FullName /headers $dll
            if ($LASTEXITCODE -ne 0) { throw "dumpbin /headers failed with exit code $LASTEXITCODE" }
            if (-not ($headers -match $machine)) { throw "osdp.dll is not built for $rid" }
            $deps = & $dumpbin.FullName /dependents $dll
            $deps
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed with exit code $LASTEXITCODE" }
            if (-not ($deps -match '^\s+\S+\.dll\s*$')) { throw "dumpbin listed no dependencies" }
            if ($deps -match 'VCRUNTIME|MSVCP|api-ms-win-crt') { throw "osdp.dll for $rid links the dynamic CRT" }
          }
      # The .NET suite shares nothing with the wheel build, so it runs in the
      # background while cibuildwheel works; the collect step below waits.
      - name: Start the .NET tests
        id: dotnet_start
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dotnet-test-logs
          # Concurrent first runs of the SDK race on its first-use setup;
          # one restore up front does that setup and fills the package cache.
          dotnet restore dotnet/LibOSDP.slnx
          # The subshell inherits errexit, so the exit code is captured with
          # `||` or a failing run would never write its status. Detaching its
          # stdio lets the step finish on Windows, where the runner otherwise
          # waits for every process holding the step's output handles.
          for rid in ${{ matrix.rids }}; do
            ( rc=0
              scripts/test-dotnet-native.sh "$rid" >"dotnet-test-logs/$rid.log" 2>&1 || rc=$?
              echo "$rc" >"dotnet-test-logs/$rid.status.tmp"
              mv "dotnet-test-logs/$rid.status.tmp" "dotnet-test-logs/$rid.status"
            ) </dev/null >/dev/null 2>&1 &
          done
      - name: Build and smoke-test wheels
        uses: pypa/cibuildwheel@v4.3.4
        with:
          package-dir: python/
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.wheel_archs }}
          # Build for Python >= 3.10 only: setuptools >= 83 (needed for the
          # PEP 639 license expression in setup.py) dropped Python 3.9.
          CIBW_SKIP: "cp39-*"
      - name: Collect the .NET tests
        if: ${{ !cancelled() && steps.dotnet_start.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          # Background runs are only reaped at job end, so a hung one would
          # hold the job until GitHub's 6 h limit; give them an hour in all.
          deadline=$(( $(date +%s) + 3600 ))
          for rid in ${{ matrix.rids }}; do
            while [ ! -f "dotnet-test-logs/$rid.status" ] && [ "$(date +%s)" -lt "$deadline" ]; do
              sleep 5
            done
            if [ -f "dotnet-test-logs/$rid.status" ]; then
              rc="$(cat "dotnet-test-logs/$rid.status")"
            else
              echo "still running after 60 min; gave up" >>"dotnet-test-logs/$rid.log"
              rc=timeout
            fi
            echo "::group::.NET tests $rid (exit $rc)"
            cat "dotnet-test-logs/$rid.log"
            echo "::endgroup::"
            [ "$rc" = 0 ] || { echo "::error::.NET tests failed for $rid ($rc)"; status=1; }
          done
          exit "$status"
      - uses: actions/upload-artifact@v7
        with:
          name: natives-${{ matrix.job }}
          path: native-*/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.job }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # MSYS2 (MinGW/UCRT/Clang) exercises the libosdp core on non-MSVC Windows
  # backends. These toolchains do not define _MSC_VER, so the `NOT MSVC` gates
  # in CMakeLists.txt would normally pull in utils/, unit-tests, and examples
  # — all of which rely on POSIX APIs (fork, sys/select.h, System V IPC) that
  # MSYS2's native Windows subsystems do not provide. OPT_OSDP_LIB_ONLY=ON
  # skips those subdirectories so only src/ is built, which is what these
  # toolchains can realistically support.
  msys2_lib_only:
    name: MSYS2 ${{ matrix.name }}
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MinGW64 GCC
            msystem: MINGW64
            packages: >-
              mingw-w64-x86_64-gcc
              mingw-w64-x86_64-cmake
              mingw-w64-x86_64-ninja
          - name: UCRT64 GCC
            msystem: UCRT64
            packages: >-
              mingw-w64-ucrt-x86_64-gcc
              mingw-w64-ucrt-x86_64-cmake
              mingw-w64-ucrt-x86_64-ninja
          - name: CLANG64 Clang
            msystem: CLANG64
            packages: >-
              mingw-w64-clang-x86_64-clang
              mingw-w64-clang-x86_64-cmake
              mingw-w64-clang-x86_64-ninja
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          cache: true
          install: ${{ matrix.packages }}
      - name: Configure
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Debug -DOPT_OSDP_LIB_ONLY=ON .
      - name: Build
        run: cmake --build build --parallel

  # A bare-metal ARM toolchain models two things the x86-64 glibc build cannot:
  # newlib types uint32_t as `unsigned long`, so a `%d`/`%u` applied to a
  # uint32_t is a -Wformat error here while staying silent on the host; and it
  # is the toolchain family our embedded targets actually use. Compile-only —
  # there is nothing to link or run against.
  bare_metal_arm:
    name: Bare-metal ARM (type/format checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install arm-none-eabi toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
      - name: Generate osdp_config.h
        run: cmake -B build -DOPT_OSDP_LIB_ONLY=ON .
      - name: Compile core for arm-none-eabi
        run: |
          # osdp_trs.c is only built with TRS on; the header stubs it otherwise.
          for f in src/*.c; do
            extra=()
            if [ "$f" = src/osdp_trs.c ]; then extra=(-DOPT_BUILD_OSDP_TRS); fi
            arm-none-eabi-gcc -c -o /dev/null "$f" "${extra[@]}" \
              -Iinclude -Isrc -Isrc/crypto -Iutils/include -Ibuild/include \
              -std=c11 -Wall -Wextra -Wformat=2 -Werror \
              -Wno-unused-parameter -Wno-format-nonliteral
          done

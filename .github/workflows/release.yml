name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Validate tag and release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          submodules: recursive
      - name: Verify tag is signed by the release key
        shell: bash
        env:
          # Primary key of the release identity. Signatures are accepted from
          # any valid subkey it certifies, so a routine subkey rotation needs
          # no change here or in any other repository.
          RELEASE_KEY: D8861B9C6B9C4284D980D6016804DFEE281234B2
        run: |
          set -euo pipefail
          # Gates the whole pipeline: every downstream job needs this preflight.
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME; chmod 700 "$GNUPGHOME"
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
            https://github.com/sidcha.gpg | gpg --batch --import
          # The key URL serves every key the account publishes, so importing it
          # is not a gate on its own. gpg names the certifying primary key in
          # the last field of VALIDSIG -- require that to be RELEASE_KEY. Also
          # require GOODSIG, which gpg withholds (in favour of EXPKEYSIG or
          # REVKEYSIG) when the signing key is expired or revoked.
          status="$(git -c gpg.program=gpg verify-tag --raw "${GITHUB_REF_NAME}" 2>&1 || true)"
          printf '%s\n' "${status}"
          primary="$(awk '/^\[GNUPG:\] VALIDSIG /{print $NF}' <<<"${status}")"
          if ! grep -q "^\[GNUPG:\] GOODSIG " <<<"${status}" \
             || [ "${primary}" != "${RELEASE_KEY}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not signed by the release key"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} signature verified"
      - name: Validate tag matches project versions
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ "${tag}" == "${version}" ]]; then
            echo "Tag must start with v: ${tag}" >&2
            exit 1
          fi

          cmake_version="$(perl -ne 'print $1 if (/project\(libosdp VERSION (\d+\.\d+\.\d+)\)/)' CMakeLists.txt)"
          cmake_marker="$(perl -ne 'print $1 if (/^set\(LIBOSDP_PRERELEASE "([^"]*)"\)/)' CMakeLists.txt)"
          # pyproject tolerates a .postN suffix (PyPI re-release); .dev is rejected below
          py_version="$(perl -ne 'print $1 if (/^version = "(\d+\.\d+\.\d+)(?:\.post\d+)?"/)' python/pyproject.toml)"
          py_dev="$(perl -ne 'print "dev" if (/^version = "\d+\.\d+\.\d+\.dev/)' python/pyproject.toml)"
          lib_version="$(perl -ne 'print $1 if (/^  "version": "(\d+\.\d+\.\d+)(?:-dev)?",$/)' library.json)"
          lib_dev="$(perl -ne 'print "dev" if (/^  "version": "\d+\.\d+\.\d+-dev",$/)' library.json)"
          config_version="$(perl -ne 'print $1 if (/^#define PROJECT_VERSION\s+"(\d+\.\d+\.\d+)"/)' platformio/osdp_config.h)"
          verstr_dev="$(perl -ne 'print "dev" if (/^#define LIBOSDP_VERSION_STR\s+"\d+\.\d+\.\d+-dev"/)' platformio/osdp_config.h)"
          release_file="CHANGELOG/RELEASE-${tag}.md"

          # A release tag must point at a published (marker-cleared) commit; a
          # tag on a prepared -dev commit is a mistake and must fail fast.
          if [[ -n "${cmake_marker}" || -n "${py_dev}" || -n "${lib_dev}" || -n "${verstr_dev}" ]]; then
            echo "Tag ${tag} points at a prepared (pre-release) commit: the release marker is not cleared" >&2
            exit 1
          fi

          for declared in "${cmake_version}" "${py_version}" "${lib_version}" "${config_version}"; do
            if [[ "${declared}" != "${version}" ]]; then
              echo "Version mismatch for tag ${tag}: expected ${version}, found ${declared}" >&2
              exit 1
            fi
          done

          if [[ ! -f "${release_file}" ]]; then
            echo "CHANGELOG is missing ${release_file} for ${tag}" >&2
            exit 1
          fi

          python3 scripts/changelog_tool.py validate --file "${release_file}" --expected-version "${tag}" --quiet
          python3 scripts/changelog_tool.py notes --file "${release_file}" --output RELEASE.txt
          if [[ ! -s RELEASE.txt ]]; then
            echo "Failed to extract release notes from ${release_file}" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE.txt

  ci:
    needs: preflight
    uses: ./.github/workflows/reusable-ci.yml

  cross_platform_build:
    name: Build on ${{ matrix.os }}
    needs: preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          submodules: recursive
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DOPT_OSDP_LIB_ONLY=on .
      - name: Build
        run: cmake --build build --parallel 8
      - name: Run unit-tests
        run: cmake --build build --parallel 8 --target check
      - name: Pack built binaries
        run: cmake --build build --target package
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libosdp-${{ matrix.os }}-binaries
          path: build/artifacts/

  build_pypi:
    name: Build PyPI distributions
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            image: manylinux
            archs: x86_64
          - os: ubuntu-22.04
            platform: linux
            image: manylinux
            archs: aarch64
          - os: ubuntu-22.04
            platform: linux
            image: musllinux
            archs: x86_64
          - os: ubuntu-22.04
            platform: linux
            image: musllinux
            archs: aarch64
          - os: macos-15-intel
            platform: macos
            image: macosx
            archs: "x86_64 universal2"
          - os: macos-latest
            platform: macos
            image: macosx
            archs: "arm64"
          - os: windows-2022
            platform: windows
            image: win
            archs: "AMD64 ARM64"
    env:
      CIBW_OUTPUT_DIR: wheelhouse
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          submodules: recursive
      - name: Set up QEMU
        if: matrix.platform == 'linux'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all
      - name: Set up Docker Buildx
        if: matrix.platform == 'linux'
        uses: docker/setup-buildx-action@v4
      - name: Set up Python
        if: matrix.platform != 'linux'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v4.3.0
        with:
          output-dir: ${{ env.CIBW_OUTPUT_DIR }}
          package-dir: python/
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.archs }}
          CIBW_ARCHS_MACOS: ${{ matrix.archs }}
          CIBW_ARCHS_WINDOWS: ${{ matrix.archs }}
          CIBW_BUILD: "*-${{ matrix.image }}_*"
          # Build for Python >= 3.10 only: setuptools >= 83 (needed for the
          # PEP 639 license expression in setup.py) dropped Python 3.9.
          CIBW_SKIP: "cp39-*"
      - name: Upload wheelhouse artifact
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheelhouse-${{ matrix.os }}-${{ matrix.image }}-${{ matrix.archs }}
          path: ${{ env.CIBW_OUTPUT_DIR }}

  build_sdist:
    name: Build source distribution
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          submodules: recursive
      - name: Build sdist
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          pushd python
          python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: python/dist/*.tar.gz

  package_platformio:
    name: Prepare PlatformIO package
    needs: [preflight, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          submodules: recursive
      - name: Archive PlatformIO package source
        run: git archive --format tar.gz --prefix "libosdp-${GITHUB_REF_NAME}/" -o libosdp-platformio-${GITHUB_REF_NAME}.tar.gz "${GITHUB_SHA}"
      - uses: actions/upload-artifact@v7
        with:
          name: platformio-package
          path: libosdp-platformio-${{ github.ref_name }}.tar.gz

  build_esp_idf:
    name: Build ESP-IDF component (${{ matrix.target }})
    needs: preflight
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    strategy:
      fail-fast: false
      matrix:
        # One Xtensa and one RISC-V target. The component is portable C over
        # esp_timer/esp_random, so the instruction set is the only axis that can
        # plausibly break it; a per-chip matrix would buy nothing but minutes.
        target: [esp32, esp32c3]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          submodules: recursive
      - name: Mark the checkout safe for git
        shell: bash
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Link the checkout in as the libosdp component
        shell: bash
        run: |
          set -euo pipefail
          # ESP-IDF names a component after its directory basename, so the
          # component must be reached through a path called "libosdp". The
          # link is generated rather than committed because a checked-in
          # symlink to the repo root makes the tree infinitely deep to
          # anything that walks it following links.
          mkdir -p tests/esp-idf/component-build/components
          ln -sfn ../../../.. tests/esp-idf/component-build/components/libosdp
      - name: Build for ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          . "${IDF_PATH}/export.sh"
          cd tests/esp-idf/component-build
          idf.py set-target "${{ matrix.target }}"
          idf.py build

  package_idf_component:
    name: Pack ESP-IDF component
    needs: preflight
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          submodules: recursive
      - name: Mark the checkout safe for git
        shell: bash
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Pack the component
        shell: bash
        run: |
          set -euo pipefail
          . "${IDF_PATH}/export.sh"
          # Proves the manifest packs before the pipeline reaches the
          # irreversible upload, and leaves the exact tarball as an artifact so
          # a rejected release can be diagnosed without reproducing the build.
          compote component pack \
            --name libosdp \
            --version "${{ needs.preflight.outputs.version }}"
      - name: Verify the submodule made it into the archive
        shell: bash
        run: |
          set -euo pipefail
          # utils/ is a git submodule and the packer globs the working tree, so
          # a non-recursive checkout would publish a component that cannot
          # compile -- with no error at pack time. Fail here instead.
          archive="$(find dist -name 'libosdp_*.tgz' -print -quit)"
          if [[ -z "${archive}" ]]; then
            echo "::error::compote produced no archive" >&2
            exit 1
          fi
          # List once into a file rather than piping tar into each grep: under
          # pipefail, "grep -q" exits on its first match and the SIGPIPE that
          # kills tar fails the pipeline, so a file that IS present reports as
          # missing whenever it matches early in the listing.
          tar -tzf "${archive}" > contents.txt
          # compote writes entries with a leading "./", so match them exactly
          # rather than anchoring on the bare path.
          missing=()
          for f in ./utils/src/utils.c ./esp-idf/component.cmake \
                   ./esp-idf/src/osdp_esp.c ./src/osdp_cp.c ./include/osdp.h
          do
            grep -qxF "${f}" contents.txt || missing+=("${f}")
          done
          if (( ${#missing[@]} )); then
            echo "::error::${archive} is missing: ${missing[*]}" >&2
            exit 1
          fi
          echo "Packed ${archive} ($(stat -c%s "${archive}") bytes), contents verified"
      - uses: actions/upload-artifact@v7
        with:
          name: idf-component-package
          path: dist/*.tgz

  publish_idf_component:
    name: Publish ESP Component Registry
    needs: [preflight, ci, cross_platform_build, build_esp_idf, package_idf_component, build_pypi, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          submodules: recursive
      - name: Check whether this version is already published
        id: registry
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          # The registry rejects re-uploading an existing version, so rerunning
          # the workflow after a later job failed would fail here on work that
          # already succeeded. PlatformIO has to infer that from the failure
          # text; this registry can be asked directly, so ask it -- skipping
          # deliberately beats swallowing a failure that merely says "exists".
          url="https://components.espressif.com/api/components/sidcha/libosdp"
          code="$(curl -sS -o response.json -w '%{http_code}' \
            --retry 5 --retry-all-errors --retry-delay 2 "${url}")"
          case "${code}" in
          200)
            if jq -e --arg v "${VERSION}" \
                 'any(.versions[]?; .version == $v)' response.json >/dev/null
            then
              published=true
            else
              published=false
            fi
            ;;
          404)
            # Component not in the registry at all: this is the first upload.
            published=false
            ;;
          *)
            echo "::error::Registry returned HTTP ${code} for ${url}" >&2
            exit 1
            ;;
          esac
          echo "published=${published}" >> "${GITHUB_OUTPUT}"
          echo "Version ${VERSION} already published: ${published}"
      - name: Upload to the ESP Component Registry
        if: steps.registry.outputs.published != 'true'
        uses: espressif/upload-components-ci-action@v2.2.1
        with:
          namespace: sidcha
          # "<name>:<path>" -- the name is mandatory for a component at the
          # repo root, where there is no directory basename to infer it from.
          components: libosdp:.
          # idf_component.yml deliberately carries no `version`: this input
          # only fills in a version the manifest does not state, it cannot
          # override one. Take it from preflight, which has already checked the
          # tag against all four in-tree version files.
          version: ${{ needs.preflight.outputs.version }}
          api_token: ${{ secrets.IDF_COMPONENT_API_TOKEN }}

  publish_platformio:
    name: Publish PlatformIO
    needs: [preflight, ci, cross_platform_build, package_platformio, build_pypi, build_sdist]
    runs-on: ubuntu-latest
    env:
      PLATFORMIO_AUTH_TOKEN: ${{ secrets.PLATFORMIO_AUTH_TOKEN }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install PlatformIO CLI
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      - name: Publish to PlatformIO Registry
        id: publish
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          pio package publish --type library --no-interactive --owner sidcha 2>&1 | tee publish-platformio.log
      - name: Accept existing PlatformIO version on rerun
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.publish.outcome }}" == "success" ]]; then
            exit 0
          fi

          if grep -Eqi 'already exists|already published|version.+exists' publish-platformio.log; then
            echo "PlatformIO version already exists; treating rerun as satisfied."
            exit 0
          fi

          echo "PlatformIO publish failed" >&2
          exit 1

  publish_pypi:
    name: Upload to PyPI
    needs: [preflight, ci, cross_platform_build, build_pypi, build_sdist, publish_platformio]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: python/dist
          merge-multiple: true
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist/
          skip-existing: true

  create_release:
    name: Create GitHub release
    needs: [preflight, cross_platform_build, publish_pypi, publish_idf_component]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: libosdp-*-binaries
          path: release-assets
          merge-multiple: false
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-notes
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          find release-assets -type f -exec cp {} release-files/ \;
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          body_path: release-notes/RELEASE.txt
          files: release-files/*
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
